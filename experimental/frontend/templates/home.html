{% extends "base.html" %} {% block title %}Home - JF-Resolve{% endblock %} {%
block content %}
<div x-data="homePage">
    <!-- Fixed Background Backdrop -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" x-show="getCurrentHero() && !disableBackdrop"
        x-transition.opacity.duration.1000ms>
        <template x-if="getCurrentHero()">
            <div class="absolute inset-0" :key="`bg-${heroIndex}`">
                <template x-if="getHeroImage()">
                    <img :src="getHeroImage()"
                        class="w-full h-full object-cover blur-sm opacity-50 scale-105 transform transition-all duration-[2000ms] no-fallback"
                        :alt="`Background for ${getCurrentHero()?.title}`" :key="`img-${heroIndex}`" />
                </template>
                <div class="absolute inset-0 bg-gradient-to-t from-base-100 via-base-100/30 to-transparent"></div>
            </div>
        </template>
    </div>

    <!-- Featured dashboard -->
    <section class="jfr-home-dashboard grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_21rem] gap-4 md:gap-5 mt-3 md:mt-5 mb-8"
        :style="getUpcomingItems().length ? '' : 'grid-template-columns: minmax(0, 1fr)'" x-show="getCurrentHero()">
        <div class="jfr-home-hero relative h-[56vh] min-h-[390px] max-h-[660px] md:min-h-[520px] rounded-[1.6rem] overflow-hidden group jfr-glass transition-opacity duration-500 ease-out"
            :class="heroVisible ? 'opacity-100' : 'opacity-20'">
            <template x-if="getCurrentHero()">
                <div class="absolute inset-0" :key="getCurrentHero().uuid || getCurrentHero().id || getCurrentHero().tmdb_id">
                    <img :src="getHeroImage()" class="w-full h-full object-cover transition-transform duration-[18s] group-hover:scale-105"
                        :alt="getCurrentHero()?.title" />
                    <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/48 to-transparent"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-black/10"></div>
                    <div class="absolute inset-x-0 bottom-0 p-5 md:p-10 lg:p-12 flex items-end justify-between gap-6">
                        <div class="max-w-2xl">
                            <div class="flex gap-2 mb-3">
                                <span class="badge badge-primary border-0"
                                    x-text="getCurrentHero()?.media_type === 'tv' ? 'Featured series' : 'Featured movie'"></span>
                                <span class="badge bg-black/35 border-white/15 text-white" x-show="getCurrentHero()?.year"
                                    x-text="getCurrentHero()?.year"></span>
                            </div>
                            <h1 class="text-3xl md:text-5xl lg:text-6xl font-black text-white tracking-tight leading-[0.95] drop-shadow-xl"
                                x-text="getCurrentHero()?.title"></h1>
                            <p class="mt-4 text-sm md:text-base text-white/72 line-clamp-2 md:line-clamp-3 max-w-xl"
                                x-text="getCurrentHero()?.overview || 'Open this title to see available sources and details.'"></p>
                            <div class="flex flex-wrap items-center gap-2 mt-5">
                                <button class="btn btn-primary rounded-full px-6" @click.stop="showDetail(getCurrentHero())">
                                    <span class="text-lg">▶</span> Play
                                </button>
                                <button class="btn bg-white/10 hover:bg-white/20 border-white/15 text-white rounded-full px-5"
                                    @click.stop="showDetail(getCurrentHero())">Details</button>
                                <button class="btn btn-circle bg-white/10 hover:bg-white/20 border-white/15 text-white"
                                    title="Add to watchlist" @click.stop="addToWatchlist(getCurrentHero())">＋</button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <div class="absolute right-5 bottom-5 hidden md:flex gap-2 z-10" x-show="heroItems.length > 1 && !previewItem">
                <button class="btn btn-circle btn-sm bg-black/35 border-white/15 text-white" @click="previousHero()">←</button>
                <button class="btn btn-circle btn-sm bg-black/35 border-white/15 text-white" @click="nextHero()">→</button>
            </div>
        </div>

        <!-- Upcoming becomes a rail on desktop and a horizontal strip on smaller screens -->
        <aside class="jfr-upcoming jfr-glass rounded-[1.6rem] p-4 md:p-5 overflow-hidden" x-show="getUpcomingItems().length > 0">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Upcoming</h2>
                <a href="#catalogue-tmdb_upcoming_movies" class="btn btn-ghost btn-xs rounded-full">See all</a>
            </div>
            <div class="jfr-upcoming-list flex xl:flex-col gap-3 overflow-x-auto xl:overflow-y-auto pb-1">
                <template x-for="item in getUpcomingItems()" :key="`upcoming_${item.uuid || item.tmdb_id || item.id}`">
                    <article class="group relative flex-shrink-0 w-64 xl:w-full min-h-32 rounded-2xl overflow-hidden bg-black/25 border border-white/10 cursor-pointer"
                        @click="showDetail(item)">
                        <img :src="getHeroImage(item)" :alt="item.title" class="absolute inset-0 w-full h-full object-cover opacity-55 group-hover:scale-105 transition-transform duration-500" />
                        <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/55 to-black/10"></div>
                        <div class="relative p-4 min-h-32 flex flex-col justify-between">
                            <div>
                                <span class="text-[9px] uppercase tracking-widest text-white/55"
                                    x-text="formatReleaseLabel(item)"></span>
                                <h3 class="font-bold text-white line-clamp-2 mt-1" x-text="item.title || item.name"></h3>
                            </div>
                            <button class="btn btn-xs w-fit rounded-full bg-white/10 border-white/15 text-white hover:btn-primary"
                                @click.stop="addToWatchlist(item)">＋ Watchlist</button>
                        </div>
                    </article>
                </template>
            </div>
        </aside>
    </section>

    <!-- Loading State -->
    <div x-show="loading" class="w-full flex justify-center py-20">
        <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>

    <div x-show="!loading" class="space-y-4" x-cloak>
        <!-- Continue Watching (Personalized) -->
        <div id="continue-watching" x-show="continueWatching && continueWatching.length > 0" class="scroll-mt-28">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-2xl font-bold text-white px-2">
                    Continue Watching
                </h2>
            </div>
            <div class="carousel-container flex gap-4 overflow-x-auto pb-6 scrollbar-hide px-2">
                <template x-for="item in continueWatching" :key="`cw_${item.id}`">
                    <div class="relative flex-shrink-0 w-64 md:w-72 group cursor-pointer" @click="resumePlayback(item)">
                        <div
                            class="aspect-video rounded-xl overflow-hidden shadow-lg border border-white/50 relative bg-base-300">
                            <img :src="getPosterUrl(item.poster_path, item)" :alt="item.title"
                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />

                            <!-- Title Overlay for missing posters -->
                            <template x-if="!item.poster_path">
                                <div
                                    class="absolute inset-0 flex items-center justify-center p-4 text-center bg-black/40">
                                    <span class="text-white font-bold text-sm leading-tight drop-shadow-md"
                                        x-text="item.title"></span>
                                </div>
                            </template>

                            <!-- Progress Bar Overlay -->
                            <div class="absolute bottom-0 left-0 right-0 h-1.5 bg-white/20">
                                <div class="h-full bg-primary shadow-[0_0_10px_rgba(var(--p),0.5)]"
                                    :style="`width: ${item.progress_percentage}%`"></div>
                            </div>

                            <!-- Play Overlay -->
                            <div
                                class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white shadow-xl scale-90 group-hover:scale-100 transition-transform">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor"
                                        viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z" />
                                    </svg>
                                </div>
                            </div>

                            <!-- Dismiss Button -->
                            <button @click.stop="removeContinueWatching(item)"
                                class="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/60 text-white opacity-0 group-hover:opacity-100 hover:bg-error transition-all flex items-center justify-center backdrop-blur-md">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="mt-3">
                            <h3 class="font-bold text-white text-sm truncate" x-text="item.title"></h3>
                            <p class="text-[10px] uppercase tracking-wider text-gray-500 font-bold mt-1"
                                x-text="formatProgress(item)"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Watchlist -->
        <div x-show="watchlist && watchlist.length > 0">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-2xl font-bold text-white px-2">My Watchlist</h2>
            </div>
            <div class="carousel-container flex gap-3 overflow-x-auto pb-6 scrollbar-hide px-2">
                <template x-for="item in watchlist" :key="`wl_${item.tmdb_id}_${item.id || ''}`">
                    <div class="jfr-poster-card group relative flex-shrink-0 w-40 md:w-48 cursor-pointer"
                        @click="showDetail(item, $event)" @mouseenter="updateHero(item)" @mouseleave="updateHero(null)">

                        <!-- Poster Area -->
                        <div class="aspect-[2/3] relative overflow-hidden bg-base-200">
                            <img :src="getPosterUrl(null, item)" :alt="item.title" loading="lazy"
                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                onerror="this.src='/static/images/default_poster.png'" />

                            <!-- Overlay on Hover -->
                            <div
                                class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="badge badge-primary badge-xs font-black uppercase"
                                        x-text="item.media_type"></span>
                                    <span class="text-[10px] font-bold text-white/80" x-text="item.year"></span>
                                </div>
                                <div class="flex items-center gap-1 mb-1 text-warning text-[10px] font-bold"
                                    x-show="item.vote_average">
                                    <span>⭐</span>
                                    <span x-text="item.vote_average ? item.vote_average.toFixed(1) : ''"></span>
                                </div>
                                <p class="text-[10px] text-white/60 line-clamp-2" x-text="item.overview"></p>
                            </div>
                        </div>

                        <!-- Compact Info Base -->
                        <div class="jfr-poster-info p-3">
                            <h3 class="text-xs font-black line-clamp-1 group-hover:text-primary transition-colors"
                                x-text="item.title"></h3>
                            <div class="flex items-center justify-between mt-1">
                                <span class="text-[9px] font-bold uppercase tracking-widest opacity-40"
                                    x-text="item.year || 'Unknown'"></span>
                                <div class="flex gap-1" x-show="item.content_rating">
                                    <span class="text-[9px] border border-white/20 px-1 rounded uppercase opacity-60"
                                        x-text="item.content_rating"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Recently Added -->
        <div x-show="recentlyAdded && recentlyAdded.length > 0">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-2xl font-bold text-white px-2">Recents</h2>
            </div>
            <div class="carousel-container flex gap-3 overflow-x-auto pb-6 scrollbar-hide px-2">
                <template x-for="item in recentlyAdded" :key="`ra_${item.uuid}`">
                    <div class="jfr-poster-card group relative flex-shrink-0 w-40 md:w-48 cursor-pointer"
                        @click="showDetail(item, $event)" @mouseenter="updateHero(item)" @mouseleave="updateHero(null)">

                        <!-- Poster Area -->
                        <div class="aspect-[2/3] relative overflow-hidden bg-base-200">
                            <img :src="getPosterUrl(null, item)" :alt="item.title" loading="lazy"
                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                onerror="this.src='/static/images/default_poster.png'" />

                            <!-- Overlay on Hover -->
                            <div
                                class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="badge badge-primary badge-xs font-black uppercase"
                                        x-text="item.media_type"></span>
                                    <span class="text-[10px] font-bold text-white/80" x-text="item.year"></span>
                                </div>
                                <div class="flex items-center gap-1 mb-1 text-warning text-[10px] font-bold"
                                    x-show="item.vote_average">
                                    <span>⭐</span>
                                    <span x-text="item.vote_average ? item.vote_average.toFixed(1) : ''"></span>
                                </div>
                                <p class="text-[10px] text-white/60 line-clamp-2" x-text="item.overview"></p>
                            </div>
                        </div>

                        <!-- Compact Info Base -->
                        <div class="jfr-poster-info p-3">
                            <h3 class="text-xs font-black line-clamp-1 group-hover:text-primary transition-colors"
                                x-text="item.title"></h3>
                            <div class="flex items-center justify-between mt-1">
                                <span class="text-[9px] font-bold uppercase tracking-widest opacity-40"
                                    x-text="item.year || 'Unknown'"></span>
                                <div class="flex gap-1" x-show="item.content_rating">
                                    <span class="text-[9px] border border-white/20 px-1 rounded uppercase opacity-60"
                                        x-text="item.content_rating"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Dynamic Catalogues from Plugins -->
        <template x-if="isReady && catalogues.length > 0">
            <div class="space-y-4">
                <template x-for="catalogue in catalogues" :key="catalogue.slug">
                    <template x-if="catalogue.id">
                        <div class="mb-4 relative z-10 scroll-mt-28" :id="`catalogue-${catalogue.id}`"
                            x-show="catalogueItems[catalogue.id] && catalogueItems[catalogue.id].length > 0">
                            <div class="flex items-center justify-between mb-2">
                                <div>
                                    <h2 class="text-2xl font-bold text-white mb-1" x-text="catalogue.name"></h2>
                                    <template x-if="catalogue.description && !catalogue.slug?.startsWith('tmdb_')">
                                        <p class="text-sm text-gray-400" x-text="catalogue.description"></p>
                                    </template>
                                </div>
                            </div>

                            <div class="carousel-container flex gap-3 overflow-x-auto pb-8">
                                <template x-for="item in catalogueItems[catalogue.id]" :key="item.uuid">
                                    <div class="jfr-poster-card group relative flex-shrink-0 w-40 md:w-48 cursor-pointer"
                                        @click="showDetail(item, $event)" @mouseenter="updateHero(item)"
                                        @mouseleave="updateHero(null)">

                                        <!-- Poster Area -->
                                        <div class="aspect-[2/3] relative overflow-hidden bg-base-200">
                                            <img :src="getPosterUrl(item.poster_url, item)" :alt="item.title"
                                                loading="lazy"
                                                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                                                onerror="this.src='/static/images/default_poster.png'" />

                                            <!-- Overlay on Hover -->
                                            <div
                                                class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class="badge badge-primary badge-xs font-black uppercase"
                                                        x-text="item.media_type"></span>
                                                    <span class="text-[10px] font-bold text-white/80"
                                                        x-text="item.year"></span>
                                                </div>
                                                <div class="flex items-center gap-1 mb-1 text-warning text-[10px] font-bold"
                                                    x-show="item.rating">
                                                    <span>⭐</span>
                                                    <span x-text="item.rating ? item.rating.toFixed(1) : ''"></span>
                                                </div>
                                                <p class="text-[10px] text-white/60 line-clamp-2"
                                                    x-text="item.overview"></p>
                                            </div>
                                        </div>

                                        <!-- Compact Info Base -->
                                        <div class="jfr-poster-info p-3">
                                            <h3 class="text-xs font-black line-clamp-1 group-hover:text-primary transition-colors"
                                                x-text="item.title"></h3>
                                            <div class="flex items-center justify-between mt-1">
                                                <span class="text-[9px] font-bold uppercase tracking-widest opacity-40"
                                                    x-text="item.year || 'Unknown'"></span>
                                                <div class="flex gap-1" x-show="item.content_rating">
                                                    <span
                                                        class="text-[9px] border border-white/20 px-1 rounded uppercase opacity-60"
                                                        x-text="item.content_rating"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </template>
    </div>
</div>

<script src="/static/js/pages/home.js?v=4"></script>

<style>
    @media (min-width: 1280px) {
        .jfr-home-dashboard { height: clamp(560px, 60vh, 700px); }
        .jfr-home-hero, .jfr-upcoming { height: 100%; min-height: 0; max-height: none; }
        .jfr-upcoming { display: flex; flex-direction: column; }
        .jfr-upcoming-list { flex: 1; min-height: 0; }
    }

    [x-cloak] {
        display: none !important;
    }

    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>
{% endblock %}
