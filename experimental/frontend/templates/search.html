{% extends "base.html" %} {% block title %}Search - JF-Resolve{% endblock %} {%
block content %}

<div x-data="searchPage">
    <h1 class="text-3xl font-bold mb-6">Search</h1>

    <div class="form-control mb-6">
        <input type="text" x-model="query" @input.debounce.500ms="search()"
            placeholder="Search for movies and TV shows..." class="input input-bordered w-full" autofocus />
    </div>

    <div x-show="movieResults.length > 0" class="mb-8">
        <h2 class="text-2xl font-bold mb-4">
            Movies
            <span class="text-sm opacity-70" x-text="`(${movieResults.length})`"></span>
        </h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="item in movieResults" :key="item.tmdb_id">
                <div class="media-card media-card-fluid cursor-pointer" @click="showDetail(item)"
                    @mouseenter="updateHero(item)">
                    <div class="card jfr-poster-card">
                        <figure>
                            <img :src="getPosterUrl(item.poster_path, item)" :alt="item.title"
                                class="w-full h-72 object-cover" />
                        </figure>
                        <div class="card-body p-3">
                            <h3 class="card-title text-sm" x-text="item.title"></h3>
                            <p class="text-xs opacity-70" x-text="item.year"></p>
                            <div class="flex gap-1 flex-wrap">
                                <div class="badge badge-sm" :class="item.in_library ? 'badge-success' : 'badge-ghost'"
                                    x-text="item.in_library ? 'In Library' : 'Not Added'"></div>
                                <div x-show="item.is_local" class="badge badge-sm badge-info">
                                    Local
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="tvResults.length > 0" class="mb-8">
        <h2 class="text-2xl font-bold mb-4">
            TV Shows
            <span class="text-sm opacity-70" x-text="`(${tvResults.length})`"></span>
        </h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="item in tvResults" :key="item.tmdb_id">
                <div class="media-card media-card-fluid cursor-pointer" @click="showDetail(item)"
                    @mouseenter="updateHero(item)">
                    <div class="card jfr-poster-card">
                        <figure>
                            <img :src="getPosterUrl(item.poster_path, item)" :alt="item.title"
                                class="w-full h-72 object-cover" />
                        </figure>
                        <div class="card-body p-3">
                            <h3 class="card-title text-sm" x-text="item.title"></h3>
                            <p class="text-xs opacity-70" x-text="item.year"></p>
                            <div class="flex gap-1 flex-wrap">
                                <div class="badge badge-sm" :class="item.in_library ? 'badge-success' : 'badge-ghost'"
                                    x-text="item.in_library ? 'In Library' : 'Not Added'"></div>
                                <div x-show="item.is_local" class="badge badge-sm badge-info">
                                    Local
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="results && query && results.length === 0 && query.length > 0"
            class="text-center text-gray-500 mt-8">
            No results found
        </div>
    </div>

    <div x-show="videoResults.length > 0" class="mb-8">
        <h2 class="text-2xl font-bold mb-4">
            Videos
            <span class="text-sm opacity-70" x-text="`(${videoResults.length})`"></span>
        </h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="item in videoResults" :key="item.uuid">
                <div class="media-card media-card-fluid cursor-pointer" @click="showDetail(item)"
                    @mouseenter="updateHero(item)">
                    <div class="card jfr-poster-card">
                        <figure>
                            <img :src="getPosterUrl(item.poster_path, item)" :alt="item.title"
                                class="w-full h-72 object-cover" />
                        </figure>
                        <div class="card-body p-3">
                            <h3 class="card-title text-sm" x-text="item.title"></h3>
                            <p class="text-xs opacity-70" x-text="item.year"></p>
                            <div class="badge badge-sm badge-info">Local</div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="videoSeriesResults.length > 0" class="mb-8">
        <h2 class="text-2xl font-bold mb-4">
            Video Series
            <span class="text-sm opacity-70" x-text="`(${videoSeriesResults.length})`"></span>
        </h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="item in videoSeriesResults" :key="item.uuid">
                <div class="media-card media-card-fluid cursor-pointer" @click="showDetail(item)"
                    @mouseenter="updateHero(item)">
                    <div class="card jfr-poster-card">
                        <figure>
                            <img :src="getPosterUrl(item.poster_path, item)" :alt="item.title"
                                class="w-full h-72 object-cover" />
                        </figure>
                        <div class="card-body p-3">
                            <h3 class="card-title text-sm" x-text="item.title"></h3>
                            <div class="badge badge-sm badge-info">Local</div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script src="/static/js/pages/search.js"></script>

    {% endblock %}
</div>
