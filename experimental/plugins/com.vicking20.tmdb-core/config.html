<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-300 mb-1" for="tmdb-plugin-api-key">TMDB API key</label>
        <input id="tmdb-plugin-api-key" type="password" name="api_key"
            class="input input-bordered w-full" autocomplete="off" placeholder="Enter your TMDB API key">
        <p class="mt-2 text-xs text-gray-400">
            Used by this plugin for posters, metadata, search, and catalogues.
            <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener"
                class="link link-primary">Get a key from TMDB</a>.
        </p>
    </div>
</div>
